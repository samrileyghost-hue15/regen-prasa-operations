<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Regen">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%"   stop-color="#a8d44e"/>
      <stop offset="50%"  stop-color="#5aad3f"/>
      <stop offset="100%" stop-color="#1a3159"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="48" height="48" rx="11" fill="#0a1628"/>

  <!-- Track rails -->
  <path d="M 9 42 L 17 10" stroke="#2a4a72" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M 22 42 L 19 10" stroke="#2a4a72" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Sleepers -->
  <line x1="8"  y1="38" x2="24" y2="38" stroke="#2a4a72" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="9"  y1="31" x2="23" y2="31" stroke="#2a4a72" stroke-width="2"   stroke-linecap="round"/>
  <line x1="11" y1="24" x2="22" y2="24" stroke="#2a4a72" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="13" y1="17" x2="20" y2="17" stroke="#2a4a72" stroke-width="1.3" stroke-linecap="round"/>

  <!-- R — solid brand navy on dark bg: use lighter navy so it's visible -->
  <path d="M 19 10 L 19 42" stroke="#4a7ab5" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 19 10 Q 34 10 34 21 Q 34 32 23 32 L 19 32"
        stroke="#4a7ab5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 25 32 L 38 42" stroke="#4a7ab5" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Brand arc sweeps -->
  <path d="M 3 20 Q 10 4 24 7 Q 34 10 40 20"
        stroke="url(#g)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M 5 28 Q 11 14 23 17 Q 32 20 38 28"
        stroke="url(#g)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45"/>
</svg>
